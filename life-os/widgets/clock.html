<!doctype html>
<!--
  clock.html — current time + weekday/date, for Notion embeds.
  Query params:
    ?tz=Europe/Sofia   IANA time zone. Default: browser time zone.
    ?h24=1|0           24-hour clock (default 1). h24=0 -> 12-hour with AM/PM.
    ?seconds=1         Show seconds (default off).
    ?label=Sofia       Optional caption under the date line.
    ?theme=light|dark  Force theme. Default: follows Notion / OS colour scheme.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock</title>
<style>
  :root{
    --fg:#1f2328; --muted:#6b7280; --card:rgba(255,255,255,.55); --line:rgba(0,0,0,.09);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){ --fg:#e8eaed; --muted:#9aa4b2; --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.10); }
  }
  :root[data-theme="dark"]{ --fg:#e8eaed; --muted:#9aa4b2; --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.10); }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:transparent; color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:10px;
  }
  .card{
    width:100%; max-width:520px; padding:18px 20px; border-radius:12px;
    background:var(--card); border:1px solid var(--line); text-align:center;
  }
  .time{
    font-size:clamp(38px,15vw,68px); line-height:1; font-weight:650;
    letter-spacing:-.02em; font-variant-numeric:tabular-nums;
  }
  .time .sec{ font-size:.45em; font-weight:550; color:var(--muted); margin-left:.12em; }
  .time .ap{ font-size:.34em; font-weight:600; color:var(--muted); margin-left:.18em; text-transform:uppercase; }
  .date{ margin-top:8px; font-size:13px; color:var(--muted); font-weight:500; }
  .label{ margin-top:4px; font-size:11px; color:var(--muted); opacity:.8; letter-spacing:.06em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="card">
  <div class="time" id="time" aria-live="off">--:--</div>
  <div class="date" id="date"></div>
  <div class="label" id="label" hidden></div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var th = q.get('theme');
  if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);

  var tz = q.get('tz') || undefined;
  try { new Intl.DateTimeFormat('en', { timeZone: tz }); } catch (e) { tz = undefined; }

  var h24 = q.get('h24') !== '0';
  var showSec = q.get('seconds') === '1' || q.get('seconds') === 'true';
  var label = q.get('label');
  if (label) { var le = document.getElementById('label'); le.textContent = label; le.hidden = false; }

  var timeOpts = { timeZone: tz, hour: '2-digit', minute: '2-digit' };
  if (showSec) timeOpts.second = '2-digit';
  if (h24) { timeOpts.hour12 = false; timeOpts.hourCycle = 'h23'; } else { timeOpts.hour12 = true; }
  var timeFmt = new Intl.DateTimeFormat('en-GB', timeOpts);
  var dateFmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: tz, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });

  var timeEl = document.getElementById('time'), dateEl = document.getElementById('date');
  var lastDate = '';

  function pick(parts, type){
    for (var i = 0; i < parts.length; i++) if (parts[i].type === type) return parts[i].value;
    return '';
  }

  function tick(){
    var now = new Date();
    var p = timeFmt.formatToParts(now);
    var html = pick(p, 'hour') + ':' + pick(p, 'minute');
    if (showSec) html += '<span class="sec">:' + pick(p, 'second') + '</span>';
    if (!h24) { var ap = pick(p, 'dayPeriod'); if (ap) html += '<span class="ap">' + ap + '</span>'; }
    timeEl.innerHTML = html;

    var d = dateFmt.format(now);
    if (d !== lastDate) { dateEl.textContent = d; lastDate = d; }
  }

  tick();
  setInterval(tick, showSec ? 250 : 1000);
})();
</script>
</body>
</html>
