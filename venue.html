<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Venue 3D — Bedouin Forest Residence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"

</script>
<style>
  :root {
    --primary: oklch(0.442 0.125 145);
    --primary-subtle: oklch(0.957 0.022 146);
    --bg: oklch(0.965 0.006 80);
    --surface: oklch(0.984 0.003 80 / 0.96);
    --surface-solid: oklch(0.984 0.003 80);
    --recessed: oklch(0.944 0.006 80);
    --border: oklch(0.885 0.008 80);
    --text: oklch(0.255 0.010 80);
    --muted: oklch(0.520 0.010 80);
    --danger: oklch(0.560 0.170 28);
    --shadow: 0 10px 30px -12px rgb(30 25 15 / 0.35), 0 2px 6px -2px rgb(30 25 15 / 0.15);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: oklch(0.720 0.130 145);
      --primary-subtle: oklch(0.300 0.040 146);
      --bg: oklch(0.180 0.004 80);
      --surface: oklch(0.215 0.004 80 / 0.95);
      --surface-solid: oklch(0.215 0.004 80);
      --recessed: oklch(0.260 0.004 80);
      --border: oklch(0.330 0.004 80);
      --text: oklch(0.930 0.004 80);
      --muted: oklch(0.680 0.006 80);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.4 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  #stage { position: fixed; inset: 0; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: auto; cursor: pointer;
    transform-origin: 0 0; will-change: transform; }
  .lbl .in { transform: translate(-50%, -100%); background: var(--surface); border: 1px solid var(--border);
    border-left: 4px solid var(--c, var(--primary)); border-radius: 8px; padding: 3px 8px 4px; box-shadow: var(--shadow);
    font-size: 12px; font-weight: 600; line-height: 1.25; }
  .lbl .bg { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); }
  .lbl .mo { display: block; font-size: 10.5px; font-weight: 600; color: var(--c, var(--primary)); }
  .lbl.item .in { border-left-width: 1px; border-radius: 999px; font-weight: 500; font-size: 11px; padding: 2px 8px; }
  .lbl.sel .in { outline: 2px solid var(--primary); }

  /* top bar */
  .topbar { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 8px;
    align-items: center; flex-wrap: wrap; pointer-events: none; z-index: 20; }
  .topbar > * { pointer-events: auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; }
  .brand a { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; color: var(--text);
    text-decoration: none; background: var(--recessed); }
  .brand b { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 700; display: block; line-height: 1.05; }
  .brand span { font-size: 11px; color: var(--muted); }
  .seg { display: flex; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 7px 11px; border-radius: 10px; font-size: 12.5px; font-weight: 600;
    color: var(--muted); min-height: 36px; transition: background .2s var(--ease), color .2s; }
  .seg button.on { background: var(--primary); color: white; }
  #sync { font-size: 11.5px; font-weight: 600; padding: 7px 10px; color: var(--muted); }
  #sync.ok { color: var(--primary); }
  #qualityBtn { border: 1px solid var(--border); font-size: 11.5px; font-weight: 600; padding: 7px 10px; color: var(--muted); min-height: 34px; }

  /* side panel */
  #panel { position: fixed; z-index: 15; right: 10px; top: 70px; bottom: 10px; width: 360px; display: flex; flex-direction: column; overflow: hidden; }
  .tabs { display: flex; gap: 2px; padding: 4px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 9px 6px; border-radius: 10px; font-weight: 600; font-size: 13px; color: var(--muted); }
  .tabs button.on { background: var(--primary-subtle); color: var(--primary); }
  .tabs .toggle { flex: 0 0 40px; display: none; }
  .body { overflow-y: auto; padding: 12px; flex: 1; }
  .body h3 { font-family: 'Cormorant Garamond', serif; font-size: 18px; margin: 4px 0 6px; }
  .body p.sub { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .btn { border: 1px solid var(--border); background: var(--surface-solid); padding: 7px 11px; border-radius: 10px; font-weight: 600; font-size: 12.5px; min-height: 34px; }
  .btn:hover { border-color: var(--primary); }
  .btn.pri { background: var(--primary); color: #fff; border-color: transparent; }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 4px 8px; min-height: 28px; font-size: 11.5px; }
  .btn.on { background: var(--primary-subtle); border-color: var(--primary); color: var(--primary); }
  input[type=text], input[type=time], select, textarea { border: 1px solid var(--border); background: var(--surface-solid); border-radius: 8px; padding: 6px 8px; width: 100%; min-height: 32px; }
  textarea { resize: vertical; min-height: 44px; font-size: 12.5px; }
  .moment { border: 1px solid var(--border); border-left: 4px solid var(--c, var(--border)); border-radius: 12px; padding: 8px; margin-bottom: 8px; background: var(--surface-solid); }
  .moment .row + .row, .moment .row + textarea { margin-top: 6px; }
  .moment input[type=time] { flex: 1; min-width: 0; }
  .moment .dash { color: var(--muted); }
  .x { border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; font-size: 16px; }
  .x:hover { background: var(--recessed); color: var(--danger); }
  .zone { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 10px; border: 1px solid transparent; }
  .zone:hover { border-color: var(--border); background: var(--surface-solid); }
  .dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; background: var(--c); }
  .zone .nm { flex: 1; min-width: 0; }
  .zone .nm b { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .zone .nm small { color: var(--muted); font-size: 11px; display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .chip { font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--primary-subtle); color: var(--primary); }
  .palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .palette button { border: 1px solid var(--border); background: var(--surface-solid); border-radius: 10px; padding: 8px 4px 7px; font-size: 11.5px; font-weight: 600; line-height: 1.2; min-height: 54px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .palette button i { width: 18px; height: 18px; border-radius: 5px; background: var(--c); display: block; border: 1px solid rgb(0 0 0 / .12); }
  .palette button.on { border-color: var(--primary); background: var(--primary-subtle); color: var(--primary); }
  .grp { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 6px; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatches button { width: 28px; height: 28px; border-radius: 8px; border: 2px solid transparent; background: var(--c); }
  .swatches button.on { border-color: var(--text); }
  .list-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 12.5px; cursor: pointer; }
  .list-item:hover { background: var(--recessed); }
  .list-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
  label.f { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin: 8px 0 3px; }

  #hint { position: fixed; z-index: 25; top: 74px; left: 50%; transform: translateX(-50%); padding: 8px 14px; font-weight: 600; font-size: 12.5px; display: none; gap: 10px; align-items: center; }
  #hint.show { display: flex; }
  #inspector { position: fixed; z-index: 18; left: 10px; bottom: 10px; width: 300px; padding: 12px; display: none; }
  #inspector.show { display: block; }
  #inspector h4 { margin: 0 0 6px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  #inspector .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  #help { position: fixed; z-index: 10; left: 10px; bottom: 10px; padding: 8px 12px; font-size: 11.5px; color: var(--muted); max-width: 300px; }
  #help b { color: var(--text); }
  #tour { position: fixed; z-index: 30; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 14px; display: none; align-items: center; gap: 14px; min-width: 300px; }
  #tour.show { display: flex; }
  #tour .t { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; color: var(--primary); }
  #tour .d b { display: block; font-size: 15px; }
  #tour .d small { color: var(--muted); }
  #joy { position: fixed; z-index: 16; left: 22px; bottom: 26px; width: 120px; height: 120px; border-radius: 50%; display: none;
    background: rgb(255 255 255 / .22); border: 2px solid rgb(255 255 255 / .55); touch-action: none; backdrop-filter: blur(6px); }
  #joy .knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgb(255 255 255 / .85); box-shadow: var(--shadow); }
  body.walk.touch #joy { display: block; }
  body.walk.touch #help { display: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: var(--bg); font-family: 'Cormorant Garamond', serif; font-size: 22px; transition: opacity .5s; }
  #loading.gone { opacity: 0; pointer-events: none; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgb(255 255 255 / .8); box-shadow: 0 0 0 1px rgb(0 0 0 / .3); z-index: 5; display: none; pointer-events: none; }
  body.walk #crosshair { display: block; }

  @media (max-width: 760px) {
    .brand span, #help { display: none; }
    .lbl .bg { display: none; }
    .lbl .in { font-size: 11px; padding: 2px 6px 3px; }
    .brand b { font-size: 16px; }
    .seg button { padding: 6px 8px; font-size: 11.5px; }
    #panel { left: 0; right: 0; bottom: 0; top: auto; width: auto; height: 50px; border-radius: 16px 16px 0 0;
      padding-bottom: env(safe-area-inset-bottom); transition: height .35s var(--ease); }
    #panel.open { height: 56vh; }
    .tabs .toggle { display: block; }
    #inspector { left: 8px; right: 8px; width: auto; bottom: 60px; }
    body.sheet-open #inspector { bottom: calc(56vh + 8px); }
    #hint { top: auto; bottom: 62px; }
    #tour { bottom: 64px; min-width: 0; width: calc(100% - 16px); }
    #joy { bottom: 72px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>

<header class="topbar">
  <div class="card brand">
    <a href="index.html" aria-label="Back to planner" title="Back to planner">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <div><b>Bedouin Forest Residence</b><span>Rositsa river · venue planner</span></div>
  </div>

  <div class="t" id="tourTime"></div>

</div>

<input type="file" id="overlayFile" accept="image/*" hidden>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { Water } from 'three/addons/objects/Water.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as GS from '@mkkellogg/gaussian-splats-3d';

// Quality: "high" on desktop (grass, reflective water, leaf cards, bloom, MSAA), "low" on phones. ?q=high|low overrides.
const QUALITY = (() => {
  try { const q = new URLSearchParams(location.search).get('q') || localStorage.getItem('venue-quality'); if (q === 'high' || q === 'low') return q; } catch {}
  return matchMedia('(pointer: coarse)').matches || innerWidth < 760 ? 'low' : 'high';
})();
const HQ = QUALITY === 'high';
const U = { uTime: { value: 0 } }; // shared shader uniforms (wind)

/* ══════════════════════════════════════════════════════════════
   GEOGRAPHY — world units are metres.
   Traced from the satellite screenshot (2000×1151 px) at ~0.25 m/px,
   origin = pixel (1000, 450) ≈ the courtyard. +x east, +z south.
   All place positions are editable in the app (drag the pins).
   ══════════════════════════════════════════════════════════════ */
const PX_SCALE = 0.25, PX_OX = 1000, PX_OY = 450;
const px = ([X, Y]) => [(X - PX_OX) * PX_SCALE, (Y - PX_OY) * PX_SCALE];
const RIVER = [[-200,960],[0,880],[250,790],[500,640],[650,575],[740,500],[790,440],[860,390],[960,330],[1100,290],[1250,245],[1450,170],[1650,85],[1720,0],[1800,-80],[2200,-400]].map(px);
const ROAD  = [[-200,1190],[-100,1120],[0,1050],[130,960],[250,840],[330,800],[450,750],[600,690],[820,580],[1000,495],[1220,395],[1380,330],[1620,215],[1760,140],[1880,0],[1950,-80],[2200,-330]].map(px);
const MEADOW_E = [[1260,560],[1330,420],[1400,330],[1620,230],[1800,140],[1950,60],[2100,300],[1950,420],[1700,560],[1450,720],[1320,700]].map(px);
const MEADOW_W = [[60,1060],[150,960],[250,860],[450,770],[600,712],[640,760],[500,850],[330,960],[200,1100],[80,1151]].map(px);
const ROT = 0.44; // compound buildings follow the road bearing
// Gravel path from the road past the caravans into the beech wood and the slab (approximate, from the walk-through photos).
const PATH = [[0, 12], [3, 22], [2, 34], [-10, 48], [-24, 60], [-33, 68]];
const SLAB = [-39, 72.5];
const isBeech = (x, z) => Math.hypot(x - SLAB[0], z - SLAB[1]) < 48 || distPoly(PATH, x, z) < 14;

// ground extents
const G = 600, GX0 = -300, GZ0 = -270;

const smooth = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
function zAt(poly, x) {
  if (x <= poly[0][0]) return poly[0][1];
  for (let i = 0; i < poly.length - 1; i++) {
    const [x0, z0] = poly[i], [x1, z1] = poly[i + 1];
    if (x <= x1) return z0 + (z1 - z0) * (x - x0) / (x1 - x0);
  }
  return poly[poly.length - 1][1];
}
function distPoly(poly, x, z) {
  let best = 1e9;
  for (let i = 0; i < poly.length - 1; i++) {
    const [ax, az] = poly[i], [bx, bz] = poly[i + 1];
    const dx = bx - ax, dz = bz - az;
    let t = ((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz);
    t = Math.max(0, Math.min(1, t));
    const ex = ax + dx * t - x, ez = az + dz * t - z;
    const d = ex * ex + ez * ez;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}
function inPoly(poly, x, z) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, zi] = poly[i], [xj, zj] = poly[j];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}
function inRect(x, z, cx, cz, w, d, r) {
  const dx = x - cx, dz = z - cz, c = Math.cos(r), s = Math.sin(r);
  const lx = dx * c - dz * s, lz = dx * s + dz * c;
  return Math.abs(lx) <= w / 2 && Math.abs(lz) <= d / 2;
}
function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, z) => vnoise(x / 23, z / 23) * 0.6 + vnoise(x / 9, z / 9) * 0.3 + vnoise(x / 3.5, z / 3.5) * 0.1;

const PAVED = [
  { cx: -14, cz: 1, w: 15, d: 10 },       // courtyard
  { cx: -39, cz: 72.5, w: 22, d: 16 },    // forest slab
  { cx: 45, cz: -30, w: 14, d: 10 },      // NE pad
];
const LAWNS = [
  (x, z) => inRect(x, z, 5, -8, 80, 34, ROT),       // compound
  (x, z) => inRect(x, z, 30, 16, 60, 22, ROT),      // garden across the road
  (x, z) => Math.hypot(x + 62, z - 92) < 17,        // forest ceremony meadow
  (x, z) => Math.hypot(x - 45, z + 30) < 10,
];
const isPaved = (x, z) => PAVED.some(p => inRect(x, z, p.cx, p.cz, p.w, p.d, ROT));
const isLawn = (x, z) => LAWNS.some(f => f(x, z));
const isMeadow = (x, z) => inPoly(MEADOW_E, x, z) || inPoly(MEADOW_W, x, z);

function heightAt(x, z) {
  const rz = zAt(RIVER, x), dz = zAt(ROAD, x);
  let h = 0;
  if (z < rz) h += smooth(0, 130, rz - z) * 38;     // forested north bank
  if (z > dz) h += smooth(35, 230, z - dz) * 30;    // south slope
  h += (fbm(x, z) - 0.5) * (0.3 + h * 0.12);
  const dr = distPoly(RIVER, x, z);
  if (dr < 7) h -= Math.pow(1 - dr / 7, 0.7) * 1.6;
  return h;
}

/* ══════════════════════════════════════════════════════════════

const SCAN_META = {

  const z = (Store.data.zones || {})[id]; if (!z) return;
  // stand at the edge of the area, on the side facing the current camera
  let dx = camera.position.x - z.x, dz = camera.position.z - z.z; const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;
  const at = { x: z.x + dx * (z.r + 3), z: z.z + dz * (z.r + 3) };
  if (state.mode !== 'walk') setMode('walk', { at, look: z }); else flyWalk(at, z, 1.4);
}

function select(kind, id) {
  state.sel = kind ? { kind, id } : null;
  renderInspector();
}
function rotateSel(deg) { const it = Store.data.items[state.sel.id]; if (it) Store.update('items/' + state.sel.id, { rot: +(((it.rot || 0) + deg * Math.PI / 180)).toFixed(4) }); }
function renderInspector() {
  const el = $('inspector');
  if (!state.sel) { el.classList.remove('show'); $('help').style.visibility = ''; return; }
  $('help').style.visibility = 'hidden';
  const { kind, id } = state.sel;
  if (kind === 'item') {
    const it = (Store.data.items || {})[id]; if (!it) { el.classList.remove('show'); return; }
    const T = TYPES[it.type];
    el.innerHTML = `<h4><span class="dot" style="--c:${it.color || T.color}"></span><span style="flex:1">${esc(T.name)}</span><button class="x" id="insClose">×</button></h4>
      <input type="text" id="insLabel" placeholder="${it.type === 'sign' ? 'Text on the sign' : 'Label (optional)'}" value="${esc(it.label)}">
      <label class="f">Note</label><textarea id="insNote" placeholder="Supplier, quantity, colours, price…">${esc(it.note)}</textarea>
      <div class="grid">
        <button class="btn sm" id="rotL" title="Rotate left">⟲ 15°</button><button class="btn sm" id="rotR" title="Rotate right">⟳ 15°</button>
        <button class="btn sm" id="scD" title="Smaller">−</button><button class="btn sm" id="scU" title="Bigger">+</button>
      </div>
      <div class="row" style="margin-top:8px"><input type="color" id="insColor" value="${it.color || T.color}" style="width:44px;height:32px;border:0;background:none;padding:0" title="Colour">
        <button class="btn sm" id="insDup">Duplicate</button><button class="btn sm danger" id="insDel">Delete</button></div>`;
    $('insLabel').onchange = e => Store.update('items/' + id, { label: e.target.value });
    $('insNote').onchange = e => Store.update('items/' + id, { note: e.target.value });
    $('insColor').onchange = e => Store.update('items/' + id, { color: e.target.value });
    $('rotL').onclick = () => rotateSel(15); $('rotR').onclick = () => rotateSel(-15);
    $('scD').onclick = () => Store.update('items/' + id, { s: Math.max(0.3, +((it.s || 1) - 0.1).toFixed(2)) });
    $('scU').onclick = () => Store.update('items/' + id, { s: Math.min(4, +((it.s || 1) + 0.1).toFixed(2)) });
    $('insDup').onclick = () => { const nid = uid(); Store.set('items/' + nid, { ...it, x: it.x + 2.5, z: it.z + 2.5, t: Date.now() }); select('item', nid); };
    $('insDel').onclick = () => { Store.set('items/' + id, null); select(null); };
  } else {
    const z = (Store.data.zones || {})[id]; if (!z) { el.classList.remove('show'); return; }
    el.innerHTML = `<h4><span class="dot" style="--c:${z.color}"></span><span style="flex:1">Place</span><button class="x" id="insClose">×</button></h4>
      <input type="text" id="zName" value="${esc(z.name)}" aria-label="Name">
      <label class="f">Second name (e.g. Bulgarian)</label><input type="text" id="zBg" value="${esc(z.bg)}">
      <div class="row" style="margin-top:8px"><input type="color" id="zColor" value="${z.color}" style="width:44px;height:32px;border:0;background:none;padding:0" title="Colour">
        <span style="font-size:12px;color:var(--muted)">Area</span><button class="btn sm" id="zRd">−</button><button class="btn sm" id="zRu">+</button></div>
      <div class="row" style="margin-top:8px"><button class="btn sm" id="zFly">Fly here</button><button class="btn sm" id="zStand">Stand here</button><button class="btn sm danger" id="zDel">Delete</button></div>
      <p class="sub" style="margin:8px 0 0">Drag the pin on the map to move it.</p>`;
    $('zName').onchange = e => Store.update('zones/' + id, { name: e.target.value });
    $('zBg').onchange = e => Store.update('zones/' + id, { bg: e.target.value });
    $('zColor').onchange = e => Store.update('zones/' + id, { color: e.target.value });
    $('zRd').onclick = () => Store.update('zones/' + id, { r: Math.max(2, z.r - 1) });
    $('zRu').onclick = () => Store.update('zones/' + id, { r: Math.min(60, z.r + 1) });
    $('zFly').onclick = () => focusZone(id); $('zStand').onclick = () => standAt(id);
    $('zDel').onclick = () => {
      if (!confirm(`Delete “${z.name}”? Moments using it will lose their place.`)) return;
      Store.set('zones/' + id, null); select(null);
    };
  }
  $('insClose').onclick = () => select(null);
  el.classList.add('show');
}

function renderHelp() {
  $('help').innerHTML = state.mode === 'bird'
    ? '<b>Bird’s-eye</b> · drag to orbit · right-drag / two fingers to pan · scroll / pinch to zoom · double-click the ground to stand there'
    : '<b>Walk</b> · drag to look around · WASD / arrows to walk (Shift = faster) · click the ground to step there';
}

/* tour */
const tour = { list: [], i: 0, timer: null };
function startTour() {
  const zones = Store.data.zones || {};
  tour.list = sortedMoments().map(([, m]) => m).filter(m => zones[m.zone]);
  if (!tour.list.length) { alert('Assign a place to at least one moment first.'); return; }
  tour.i = -1; if (innerWidth <= 760) openSheet(false); nextTour();
}
function nextTour() {
  clearTimeout(tour.timer);
  tour.i++;
  if (tour.i >= tour.list.length) return stopTour();
  const m = tour.list[tour.i], z = Store.data.zones[m.zone];
  $('tourTime').textContent = span(m) || '—'; $('tourName').textContent = m.name; $('tourZone').textContent = z.name;
  $('tour').classList.add('show');
  if (state.mode === 'walk') standAt(m.zone); else flyBird(z, z.r * 2 + 20, z.r * 1.4 + 16, 1.8);
  tour.timer = setTimeout(nextTour, 5200);
}
function stopTour() { clearTimeout(tour.timer); $('tour').classList.remove('show'); }
$('tourNext').onclick = nextTour; $('tourStop').onclick = stopTour;

/* overlay */
$('overlayFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { loadOverlay(r.result, true); };
  r.readAsDataURL(f); e.target.value = '';
};
function loadOverlay(src, persist) {
  const img = new Image();
  img.onload = () => { overlayImg = img; groundDirty = true; renderPanel(true);
    if (persist) { try { localStorage.setItem('venue-overlay', src); } catch { /* too big for local storage — still shown this session */ } } };
  img.src = src;
}
try { const s = localStorage.getItem('venue-overlay'); if (s) loadOverlay(s, false); const a = localStorage.getItem('venue-overlay-alpha'); if (a) overlayAlpha = +a; } catch {}

/* ══════════════════════════════════════════════════════════════
   DATA → SCENE
   ══════════════════════════════════════════════════════════════ */
let seeded = false;
Store.on(data => {
  if (!seeded) {
    seeded = true;
    if (!data.zones) Store.set('zones', ZONE_SEED);
    if (!data.moments || isOldSeed(data.moments)) Store.set('moments', MOMENT_SEED);
    if (!data.scans) Store.set('scans', SCAN_SEED);
    $('loading').classList.add('gone');
  }
  syncZones(); syncItems(); groundDirty = true; syncScans();
  renderPanel(); if (state.sel) {
    const exists = state.sel.kind === 'item' ? (data.items || {})[state.sel.id] : (data.zones || {})[state.sel.id];
    if (!exists) select(null); else if (!document.activeElement || !$('inspector').contains(document.activeElement)) renderInspector();
  }
});

/* ══════════════════════════════════════════════════════════════
   LOOP
   ══════════════════════════════════════════════════════════════ */
const composer = HQ ? new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 })) : null;
if (composer) {
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(512, 512), 0.12, 0.5, 0.95); composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
}
addEventListener('resize', resize); resize();
if (innerWidth / innerHeight < 1) camera.position.set(55, 260, 170); // portrait phones: start further out
setTod('day'); renderHelp(); renderPanel(true);
$('qualityBtn').textContent = HQ ? 'Quality: high' : 'Quality: fast';
$('qualityBtn').onclick = () => { try { localStorage.setItem('venue-quality', HQ ? 'low' : 'high'); } catch {} location.reload(); };

const clock = new THREE.Clock();
if (new URLSearchParams(location.search).has('paused')) state.paused = true; // testing hook
function tick() {
  if (!state.paused) tickBody();
  requestAnimationFrame(tick);
}
function tickBody() {
  const dt = Math.min(0.05, clock.getDelta()), now = performance.now();
  stepAnim(now);
  if (state.mode === 'walk') {
    if (!anim) {
      const k = walk.keys, sp = (k.ShiftLeft || k.ShiftRight ? 11 : 4) * dt;
      let f = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0) - walk.joy.y;
      let s = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0) + walk.joy.x;
      if (f || s) {
        const fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw);
        camera.position.x = Math.max(GX0 + 5, Math.min(GX0 + G - 5, camera.position.x + (fx * f + -fz * s) * sp));
        camera.position.z = Math.max(GZ0 + 5, Math.min(GZ0 + G - 5, camera.position.z + (fz * f + fx * s) * sp));
      }
      camera.position.y = heightAt(camera.position.x, camera.position.z) + EYE;
    }
    camera.rotation.set(walk.pitch, walk.yaw, 0, 'YXZ');
  } else {
    controls.update();
    if (camera.position.y < heightAt(camera.position.x, camera.position.z) + 2) camera.position.y = heightAt(camera.position.x, camera.position.z) + 2;
  }
  // keep the shadow frustum around what we're looking at
  const focus = state.mode === 'bird' ? controls.target : camera.position;
  sun.target.position.set(focus.x, 0, focus.z);
  sun.position.set(focus.x + sunDir.x * 300, Math.max(20, sunDir.y * 300), focus.z + sunDir.z * 300);
  U.uTime.value += dt;
  if (window.__water) window.__water.material.uniforms.time.value += dt * 0.5;
  if (++lightFrame % 30 === 0) updateLightPool();
  if (groundDirty) drawGround();
  updateSelRing();
  if (composer) composer.render(); else renderer.render(scene, camera);
  updateLabels();
}
tick();
window.__venue = { Store, state, setMode, setTod, setTool, applyTool, select, camera, controls, TYPES, heightAt, scene, renderer, splat: splatLayer,
  // debug/testing: advance animations and render one frame synchronously
  frame() { stepAnim(performance.now() + 1e7); tickBody(); },
};
</script>
</body>
</html>
