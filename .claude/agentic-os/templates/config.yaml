# Project config — copy to <project>/.claude/config.yaml and fill in.
# Static metadata for one initiative. Read at session start so the model
# knows the channels, people, and vendors for THIS project without asking.

project:
  name:            # short kebab-case slug, e.g. my-project-feature
  jira_epic:       # e.g. PROJ-123, if tracked
  status:          # discovery | design | build | launch | done
  owner: Borislav Bogdanov

slack_channels:    # channels where this project is discussed, if any
  - name:          # e.g. #my-project
    purpose:       # what it's used for

stakeholders:      # decision-makers and reviewers for this project, if any
  - name:
    role:
    cares_about:   # what they'll react to (for managing-up)

vendors:           # external partners/services involved, if any
  - name:
    mechanism:     # 1-line: how they fit (link to vendor deep-dive if it exists)

teams:             # internal eng/design/data teams involved
  - name:
    contact:

links:             # canonical references
  knowledge_center:
  confluence:
  prototype:
